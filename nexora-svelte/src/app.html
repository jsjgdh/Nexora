<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The one class the whole reveal system hangs on. It is set here, before
         the first paint, so the stylesheet can hide a heading only when the
         script that brings it back is running. Without JavaScript the class
         stays `no-js` and every heading is simply there. -->
    <script nonce="%sveltekit.nonce%">
      document.documentElement.classList.replace("no-js", "js");
    </script>
    <!-- The typefaces are served from this site: /fonts, under the SIL Open
         Font License. There is no third-party request to render a page here,
         and the content security policy does not have to make room for one. -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
