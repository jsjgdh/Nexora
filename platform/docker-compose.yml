# NODE_ENV is set explicitly on every service below rather than left to .env.
# Mesh authentication does NOT depend on it (B-27): service-kit refuses to boot
# without a real INTERNAL_API_KEY in every environment, and the only way past
# that is the explicit development opt-in ALLOW_INSECURE_MESH=1 — which is
# itself refused when NODE_ENV=production. An environment that merely forgot a
# line therefore fails to start instead of serving unauthenticated cross-user
# access, and no value of NODE_ENV can open the mesh. NODE_ENV still decides
# response hygiene (whether zod issue detail is returned), which is why this
# file states it rather than leaving it to .env.
#
# The Postgres password and the two platform secrets come from .env because
# they are environment-specific; .env.example's placeholder values FAIL
# validation on purpose, so a copied example cannot boot a live deployment.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: authdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    # NOTE: no published ports — services reach Postgres over the compose
    # network only. Publish 5432 locally only for debugging.

  auth:
    build:
      context: .
      args:
        SERVICE: auth
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8101
      DATABASE_URL: ${AUTH_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8101/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  curriculum:
    build:
      context: .
      args:
        SERVICE: curriculum
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8102
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8102/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  execution:
    build:
      context: .
      args:
        SERVICE: execution
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8104
      # This service's own sandboxed runners are the only tier there is: the
      # course now runs on the learner's machine, and a hosted run is our
      # runner in here — never a third party's. Which tier of our own
      # (subprocess, or one container per job) is EXECUTION_RUNNER in .env.
      # Shared Go build cache baked into this image at build time. Modern Go
      # ships no precompiled standard library, so without this every learner's
      # first program pays the cost of compiling `fmt` from scratch.
      # Cache keys are content-addressed; see runners/subprocess.ts for the
      # tradeoff. Leave unset to give every job a private cache instead.
      EXECUTION_GO_CACHE: /opt/gocache
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8104/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    # NOTE: the docker runner needs /var/run/docker.sock mounted. It is
    # deliberately NOT mounted here: enable it only on hosts you control,
    # understanding a container escape via the socket is a real risk.

  billing:
    build:
      context: .
      args:
        SERVICE: billing
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8106
      DATABASE_URL: ${BILLING_DATABASE_URL}
      # Webhook tenancy guard (B-31): set to your Dodo business/account id so a
      # correctly-signed event from a *different* merchant is ignored rather than
      # honoured. Empty = guard off (dev default). The test_mode guard (B-30)
      # needs nothing here — it activates automatically once DODO_PAYMENTS_BASE
      # points at live.dodopayments.com, which is required to take real money.
      DODO_BUSINESS_ID: ${DODO_BUSINESS_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8106/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      auth:
        condition: service_healthy
      curriculum:
        condition: service_healthy
      execution:
        condition: service_healthy
      billing:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  # The backup, on demand and never with the stack. It is behind a profile so
  # `docker compose up -d` does not start it: the backup is a JOB, run by the
  # host's cron (see docs/OPERATIONS.md), and a container that runs forever
  # holding a database connection is a job that can be forgotten.
  #
  # It runs on the compose network, so the database's port never has to be
  # published — not even to loopback. The dumps land in a named volume, which
  # the operator copies off the host on their own schedule.
  backup:
    profiles: ["backup"]
    build:
      context: .
      args:
        SERVICE: gateway
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      BACKUP_DIR: /backups
    volumes:
      - backups:/backups
    command:
      - sh
      - -c
      - >-
        node scripts/backup.mjs --url="$$AUTH_DATABASE_URL" --dir=$$BACKUP_DIR --keep-days=14
        && node scripts/backup.mjs --url="$$BILLING_DATABASE_URL" --dir=$$BACKUP_DIR --keep-days=14

  # The restore drill, same shape: a job, on demand, against a database the
  # operator names. It proves the dumps can be put back, which is the half of
  # "we have backups" that is almost never done.
  drill:
    profiles: ["drill"]
    build:
      context: .
      args:
        SERVICE: gateway
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - node scripts/backup-drill.mjs --url="$$AUTH_DATABASE_URL"

  frontend:
    # Canonical NEXORA client (SvelteKit production build). Browser-facing;
    # PUBLIC_API_URL must be reachable FROM THE BROWSER, not the container.
    build:
      context: ../nexora-svelte
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      # The browser's route to the gateway (the published host port).
      PUBLIC_API_URL: http://127.0.0.1:8080
      # This container's route to the same gateway, used by the app's own
      # /auth/session endpoints — the ones that keep the refresh token in an
      # HttpOnly cookie. PUBLIC_API_URL cannot serve there: inside this container
      # 127.0.0.1 is the container itself, not the host's published port.
      GATEWAY_URL: http://gateway:8080
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

volumes:
  pgdata:
  backups:
