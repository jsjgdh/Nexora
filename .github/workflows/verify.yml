# The project's CI contract. Every job here is a suite that exists in the repo
# and passes locally. If a job is red, the change is not shippable — do not
# merge around it.
#
# Design notes:
# - No secrets are needed. The platform suite runs in-process (no Postgres, no
#   Docker), so it is safe and fast on a clean runner.
# - The compose e2e job is nightly and manual: booting nine containers plus
#   Postgres on every PR would dominate CI time for little marginal signal.
name: verify

on:
  push:
    branches: [master, main]
    # A release tag runs the same suite, and the deploy workflows wait for
    # THIS run to be green before they roll anything. So a tag cannot ship a
    # tree the suite has not passed.
    tags: ["platform-v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: learner app — types + assertions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexora-svelte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexora-svelte/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: npm ci
      # svelte-check is the type gate. It runs its own `svelte-kit sync` first.
      - name: type check
        run: npm run check
      - name: assertion suite
        run: npx tsx scripts/verify.ts
      - name: production build
        run: npm run build
      - name: install accessibility browser
        run: npx playwright install --with-deps chromium
      - name: axe accessibility scan
        run: npm run verify:a11y
      # The UX sweep asks the question the other two do not: does the site read,
      # reflow and respond to the keyboard, on the production build. It reuses
      # the browser installed above.
      - name: UX sweep
        run: npm run verify:ux

  platform:
    name: service mesh — build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      # Go is required by the execution service tests: the suite runs a real
      # `go run` when the toolchain is present. Install it so the Go runner is
      # exercised in CI rather than silently skipped.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: npm ci
      - run: npm run build
      - name: suite
        run: npm run verify
      # Vendored IDE content must equal what the generators emit. The generators
      # read nexora-ide, a sibling checkout that exists on a contributor's machine
      # and is not part of this repo, so the gate is conditional instead of a
      # command that throws on a clean runner. With the sibling: regenerate, then
      # refuse an uncommitted diff over BOTH data dirs the generators write —
      # curriculum's snapshot (sync:curriculum) and execution's design registry
      # and attestation fixtures (sync:design, sync:fixtures), which no earlier
      # step looked at. The retired `services/*/src/vendor` path is gone from the
      # diff because no vendor directory exists anymore; verify.mjs pins that.
      # Without the sibling, `npm run verify` above already re-derived the
      # committed snapshot's content hash from its own bytes and printed that the
      # source match could not be checked — this says the same thing out loud
      # rather than pretending to gate it.
      - name: vendored IDE content in sync
        run: |
          if [ -d ../../nexora-ide ]; then
            npm run sync
            git diff --exit-code -- services/curriculum/src/data services/execution/src/data
          else
            echo "::notice::no nexora-ide sibling on this runner, so the generators cannot re-derive the vendored bytes here"
            echo "checkout nexora-ide beside branchcraft to gate them; npm run verify already refused a snapshot that does not hash to its own stamp"
          fi

  # Boots the whole mesh (Postgres + seven services + the app) and drives the
  # real HTTP surface. Too slow for every push; runs nightly and on demand.
  e2e:
    name: compose stack — e2e
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: boot the mesh
        run: docker compose up -d --build --wait
      - name: e2e
        run: npm run verify:e2e
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: tear down
        if: always()
        run: docker compose down -v
