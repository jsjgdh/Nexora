# Deploying the platform.
#
# The runbook says what a deploy is; this is the part that does it, and the
# part that can be repeated.
#
# WHY IT WAITS FOR THE VERIFY WORKFLOW
#
# A deploy that runs its own checks is a second copy of the checks, and two
# copies drift. So this workflow does not re-run the suite: it runs AFTER the
# `verify` workflow has passed on that exact commit, and refuses to deploy if
# it has not. The gate that decides whether the code is shippable is the one
# that already exists, and there is exactly one of it.
#
# TWO TARGETS, ONE PATH
#
# `gcp` is the decision of record: five Cloud Run services from one image, the
# gateway the only public ingress, Cloud SQL for the data, and a load balancer
# in front. `compose` is the fallback shape this repository was built and
# tested against: one host, `docker compose up -d`. Both roll the SAME image,
# both verify the SAME way, and both roll back the same way — so the fallback
# is a target, not a second product.
#
# WHY IT ROLLS BACK
#
# A deploy that leaves a broken platform running is worse than a deploy that
# did not happen, because the failure is now invisible to everyone who is not
# looking. So the deploy verifies ITSELF: the health check and the learner
# journey run against the DEPLOYED platform, and if either fails the previous
# image is rolled back and the run says so. A red deploy ends with the
# platform on the last known-good image, and a human is paged by the fact
# that the run failed at all.
#
# The secrets it needs, and why each is required:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY   the fallback host, and a way in
#   GITHUB_TOKEN                               to push the image
#   VERCEL_*                                   (the front door's own workflow)
#   SYNTHETIC_EMAIL, SYNTHETIC_PASSWORD        the canary account the journey
#                                              check signs in with
#
# On GCP the deploy authenticates with Workload Identity Federation — a
# short-lived token, and no key in the repository and no key in a secret. The
# provider and the service account are repository VARIABLES, set once by the
# operator; a JSON key is the older way and is deliberately not used.

name: deploy the platform

on:
  # The automatic path: the verify workflow passed on this commit.
  workflow_run:
    workflows: [verify]
    types: [completed]
  # The manual path, for the first deploy and for a re-run.
  workflow_dispatch:
    inputs:
      target:
        description: where the platform is deployed
        required: true
        default: gcp
        type: choice
        options: [gcp, compose]
      ref:
        description: the commit to deploy (blank = the branch head)
        required: false
        type: string
      reason:
        description: why this deploy is happening
        required: true
        type: string

concurrency:
  # One deploy at a time. Two rolls at once is how a host ends up on a mix of
  # two images, which is neither of them.
  group: deploy-platform-${{ inputs.target || 'gcp' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # Workload Identity Federation mints the GCP token from this

jobs:
  image:
    name: build the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.name.outputs.image }}
      previous: ${{ steps.previous.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          path: platform

      # The image is built from the same Dockerfile the compose stack builds
      # from, with the same `SERVICE` argument, so the artefact is the one the
      # local stack already runs. The `SERVICE` argument only chooses the
      # entrypoint, and every service's entrypoint reads its own environment.
      - name: build the image
        id: name
        working-directory: platform
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/nexora-platform:${{ github.sha }}
          docker build --build-arg SERVICE=gateway -t "$IMAGE" .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # What is running right now, so a rollback is a fact and not a guess.
      - name: find the image that is running
        id: previous
        working-directory: platform
        continue-on-error: true
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/nexora-platform:previous
          if [ "${{ inputs.target }}" = "compose" ]; then
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cat /srv/nexora/platform/.deployed-image 2>/dev/null" && echo "image=$IMAGE" >> "$GITHUB_OUTPUT" || true
          fi

      - name: push the image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.name.outputs.image }}"

  deploy:
    name: ${{ inputs.target || 'gcp' }} — roll, verify, roll back if it must
    needs: image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'platform-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: install the dependencies the deploy needs
        working-directory: platform
        run: npm ci

      # On GCP the deploy authenticates with Workload Identity Federation: a
      # short-lived token, no key in the repository and no key in a secret. The
      # provider and the service account are repository variables.
      - name: authenticate to Google Cloud
        if: inputs.target != 'compose'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: set up gcloud
        if: inputs.target != 'compose'
        uses: google-github-actions/setup-gcloud@v2

      # The deploy itself is the plan: `plan.json` as data, `deploy.ts` as the
      # thing that applies it, and `plan-check` as the gate that refuses it
      # drifting from this tree. The Cloud Run deploy is two passes because a
      # Cloud Run URL carries a hash that does not exist until the service does.
      - name: apply the plan
        if: inputs.target != 'compose'
        working-directory: platform
        env:
          PLATFORM_IMAGE: ${{ needs.image.outputs.image }}
        run: node infra/gcp/dist/deploy.js --apply

      # The fallback shape: the same image, rolled onto one host.
      - name: put the compose file on the host
        if: inputs.target == 'compose'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            platform/docker-compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/nexora/platform/docker-compose.yml"
      - name: roll the new image
        if: inputs.target == 'compose'
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'REMOTE'
          set -eu
          cd /srv/nexora/platform
          if [ -f .env ]; then . ./.env; fi
          export PLATFORM_IMAGE="${IMAGE}"
          # Remember what was running, so a rollback is a fact and not a guess.
          if [ -f .deployed-image ]; then
            cp .deployed-image .previous-image
          fi
          echo "${IMAGE}" > .deployed-image
          docker compose pull
          docker compose up -d --remove-orphans
          # The mesh answers its own readiness: every service has a health
          # endpoint, and the gateway probes the others. Waiting for it is
          # waiting for the whole thing, not for one container.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/deep >/dev/null 2>&1; then
              echo "the mesh is up"
              exit 0
            fi
            sleep 2
          done
          echo "the mesh did not come up" >&2
          docker compose logs --tail=100 >&2
          exit 1
          REMOTE

      # The deploy verifies ITSELF, from outside: the edge, and then the
      # journey a learner walks. Both are the same commands an operator runs,
      # which is the point — the check that decides whether the platform is
      # alive is the one that is on the host's cron, not a second one written
      # for CI.
      - name: the deployed platform answers
        working-directory: platform
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: node scripts/healthcheck.mjs "$HEALTHCHECK_URL"
      - name: the deployed platform can teach
        working-directory: platform
        env:
          SYNTHETIC_URL: ${{ vars.SYNTHETIC_URL }}
          SYNTHETIC_EMAIL: ${{ secrets.SYNTHETIC_EMAIL }}
          SYNTHETIC_PASSWORD: ${{ secrets.SYNTHETIC_PASSWORD }}
        run: node scripts/synthetic.mjs --url="$SYNTHETIC_URL"

      # The rollback. The previous image is known, so this is a redeploy of a
      # known-good artefact rather than a rebuild.
      - name: roll back if the verification failed
        if: failure() && inputs.target == 'compose'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'REMOTE'
          set -eu
          cd /srv/nexora/platform
          if [ ! -f .previous-image ]; then
            echo "there is no previous image to roll back to — this is the first deploy" >&2
            exit 0
          fi
          export PLATFORM_IMAGE="$(cat .previous-image)"
          docker compose pull
          docker compose up -d --remove-orphans
          echo "rolled back to $(cat .previous-image)"
          REMOTE
      - name: roll back on Google Cloud
        if: failure() && inputs.target != 'compose'
        working-directory: platform
        env:
          PREVIOUS: ${{ needs.image.outputs.previous }}
        run: |
          if [ -z "$PREVIOUS" ]; then
            echo "there is no previous image recorded, so there is nothing to roll back to" >&2
            exit 0
          fi
          PLATFORM_IMAGE="$PREVIOUS" node infra/gcp/dist/deploy.js --apply
